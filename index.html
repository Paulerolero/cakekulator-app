<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cakekulator - Costos, Porciones y Precios para Pastelería</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#ec4899">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cakekulator">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pink: {
              50: '#fdf2f8',
              100: '#fce7f3',
              200: '#fbcfe8',
              300: '#f9a8d4',
              400: '#f472b6',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
              800: '#9d174d',
              900: '#831843',
            },
            dark: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#0b0f19',
            }
          }
        }
      }
    }
  </script>

  <!-- Firebase App, Auth, Firestore & Messaging SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- HTML2Canvas & PDF Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Chart.js for Finance Panel -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>

<body
  class="text-gray-800 dark:text-gray-100 bg-[#faf5f8] dark:bg-[#0f172a] antialiased min-h-screen md:h-screen md:overflow-hidden flex flex-col md:flex-row pb-24 md:pb-0 transition-colors duration-200 select-none sm:select-auto">

  <!-- ==========================================
       DESKTOP SIDEBAR (Visible en md y pantallas grandes)
       ========================================== -->
  <aside id="desktop-sidebar"
    class="hidden md:flex flex-col w-64 lg:w-72 shrink-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-r border-pink-100/80 dark:border-slate-800 h-screen sticky top-0 z-30 transition-all duration-200 select-none">
    
    <!-- Sidebar Brand Header -->
    <div class="p-4 lg:p-5 border-b border-pink-50 dark:border-slate-800/80 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 cursor-pointer group" onclick="App.switchTab('dashboard')">
        <img id="sidebar-brand-logo" src="assets/icons/logo.png" alt="Cakekulator Logo"
          class="w-10 h-10 rounded-2xl shadow-md shadow-pink-200/60 dark:shadow-none object-cover ring-1 ring-pink-200/60 dark:ring-slate-700 group-hover:scale-105 transition-transform duration-200">
        <div class="min-w-0">
          <span id="sidebar-brand-title"
            class="font-extrabold text-base lg:text-lg text-gray-900 dark:text-white tracking-tight block leading-tight">
            Cake<span class="text-pink-600 dark:text-pink-400">kulator</span>
          </span>
          <span id="sidebar-brand-name"
            class="text-[10px] font-bold text-gray-400 dark:text-gray-400 uppercase tracking-wider truncate max-w-[140px] block">
            Gestión Pastelera
          </span>
        </div>
      </div>

      <!-- Badge indicador de ambiente -->
      <span id="sidebar-mode-badge" class="px-2 py-0.5 text-[10px] font-black rounded-lg bg-pink-100 dark:bg-slate-800 text-pink-700 dark:text-pink-300">
        🎂 Prod
      </span>
    </div>

    <!-- Sidebar Navigation Scrollable Links -->
    <div class="flex-1 overflow-y-auto p-3 lg:p-4 space-y-5 custom-scrollbar">

      <!-- Categoría 1: PANEL & OPERACIONES -->
      <div class="space-y-1">
        <span class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-gray-400 dark:text-slate-500 block">
          Panel & Operaciones
        </span>
        <button onclick="App.switchTab('dashboard')" data-tab="dashboard" id="sidebar-nav-dashboard"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span class="text-base">🏠</span>
            <span>Inicio / Dashboard</span>
          </div>
        </button>
        <button onclick="App.switchTab('finance')" data-tab="finance" id="sidebar-nav-finance"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span class="text-base">📊</span>
            <span>Finanzas & Métricas</span>
          </div>
        </button>
      </div>

      <!-- Categoría 2: CATÁLOGO Y COSTOS -->
      <div class="space-y-1">
        <span class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-gray-400 dark:text-slate-500 block">
          Catálogo & Costos
        </span>
        <button onclick="App.switchTab('recipes')" data-tab="recipes" id="sidebar-nav-recipes"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span id="sidebar-icon-recipes" class="text-base">🎂</span>
            <span id="sidebar-text-recipes">Recetas & Fichas</span>
          </div>
          <span id="sidebar-badge-recipes" class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-pink-100/70 text-pink-700 dark:bg-slate-800 dark:text-pink-300">0</span>
        </button>
        <button onclick="App.switchTab('ingredients')" data-tab="ingredients" id="sidebar-nav-ingredients"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span id="sidebar-icon-ingredients" class="text-base">📦</span>
            <span id="sidebar-text-ingredients">Insumos & Stock</span>
          </div>
          <span id="sidebar-badge-ingredients" class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-amber-100/70 text-amber-800 dark:bg-slate-800 dark:text-amber-300">0</span>
        </button>
        <button onclick="App.switchTab('simulator')" data-tab="simulator" id="sidebar-nav-simulator"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span class="text-base">🧮</span>
            <span>Simulador de Precios</span>
          </div>
        </button>
      </div>

      <!-- Categoría 3: GESTIÓN COMERCIAL -->
      <div class="space-y-1">
        <span class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-gray-400 dark:text-slate-500 block">
          Gestión Comercial
        </span>
        <button onclick="App.switchTab('quotes')" data-tab="quotes" id="sidebar-nav-quotes"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span id="sidebar-icon-quotes" class="text-base">📋</span>
            <span id="sidebar-text-quotes">Cotizaciones & Pedidos</span>
          </div>
          <span id="sidebar-badge-quotes" class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 hidden">0</span>
        </button>
        <button onclick="App.switchTab('customers')" data-tab="customers" id="sidebar-nav-customers"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span class="text-base">👥</span>
            <span>Clientes (CRM)</span>
          </div>
          <span id="sidebar-badge-customers" class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-purple-100 text-purple-800 dark:bg-slate-800 dark:text-purple-300">0</span>
        </button>
        <button onclick="App.switchTab('market-radar')" data-tab="market-radar" id="sidebar-nav-market"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span class="text-base">🛒</span>
            <span>Radar de Ofertas</span>
          </div>
        </button>
      </div>

      <!-- Categoría 4: SISTEMA -->
      <div class="space-y-1">
        <span class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-gray-400 dark:text-slate-500 block">
          Configuración
        </span>
        <button onclick="App.switchTab('settings')" data-tab="settings" id="sidebar-nav-settings"
          class="sidebar-nav-item w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition text-gray-600 dark:text-gray-300 hover:bg-pink-50/70 dark:hover:bg-slate-800/80 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span class="text-base">⚙️</span>
            <span>Ajustes & Notificaciones</span>
          </div>
        </button>
      </div>

    </div>

    <!-- Sidebar Footer / Quick Status -->
    <div class="p-3 lg:p-4 border-t border-pink-50 dark:border-slate-800/80 bg-pink-50/30 dark:bg-slate-900/50 space-y-2.5">
      <!-- Tarjeta rápida de ambiente / cambio -->
      <div class="p-2.5 rounded-xl bg-white dark:bg-slate-800/90 border border-pink-100 dark:border-slate-700/80 flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <span id="sidebar-mode-icon" class="text-lg shrink-0">🎂</span>
          <div class="min-w-0">
            <span class="text-[10px] text-gray-400 dark:text-gray-400 block leading-tight">Ambiente Actual</span>
            <span id="sidebar-mode-name" class="text-xs font-bold text-gray-800 dark:text-gray-100 truncate block">Venta Productos</span>
          </div>
        </div>
        <button onclick="App.showModeSelectionModal()" title="Cambiar Ambiente"
          class="p-1.5 rounded-lg bg-pink-50 dark:bg-slate-700 hover:bg-pink-100 dark:hover:bg-slate-600 text-pink-600 dark:text-pink-300 text-xs font-bold transition cursor-pointer">
          ⇄
        </button>
      </div>

      <!-- Estado de respaldo en la nube -->
      <div class="flex items-center justify-between px-1 text-[11px] text-gray-500 dark:text-gray-400">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Sincronización PWA</span>
        </span>
        <span class="text-[10px] font-mono text-gray-400">v3.6</span>
      </div>
    </div>

  </aside>

  <!-- ==========================================
       MAIN APP WRAPPER (TOPBAR + CONTENIDO)
       ========================================== -->
  <div class="flex-1 flex flex-col min-w-0 md:h-screen md:overflow-hidden">

    <!-- Top Navigation Header (Desktop Topbar + Mobile Topbar) -->
    <header
      class="shrink-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-pink-100/80 dark:border-slate-800 px-3 sm:px-6 py-2.5 sm:py-3 transition-colors duration-200 sticky top-0 md:static">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">

        <!-- Mobile Brand Logo (Oculto en Desktop Sidebar) -->
        <div class="flex md:hidden items-center gap-2 cursor-pointer select-none group shrink-0"
          onclick="App.switchTab('dashboard')">
          <img id="header-brand-logo" src="assets/icons/logo.png" alt="Cakekulator Logo"
            class="w-8 h-8 rounded-xl shadow-md shadow-pink-200/70 dark:shadow-none object-cover ring-1 ring-pink-200/50 dark:ring-slate-700">
          <div>
            <span id="header-brand-title"
              class="font-extrabold text-base text-gray-900 dark:text-white tracking-tight block leading-none">
              Cake<span class="text-pink-600 dark:text-pink-400">kulator</span>
            </span>
            <span id="header-brand-name"
              class="text-[9px] font-semibold text-gray-400 dark:text-gray-400 uppercase tracking-wider truncate max-w-[110px] block">
              Gestión Pastelera
            </span>
          </div>
        </div>

        <!-- Desktop Current View Title / Breadcrumb -->
        <div class="hidden md:flex items-center gap-2 shrink-0">
          <span id="desktop-view-icon" class="text-xl">🏠</span>
          <div>
            <h2 id="desktop-view-title" class="font-black text-sm lg:text-base text-gray-900 dark:text-white tracking-tight leading-tight">
              Dashboard Principal
            </h2>
            <span id="desktop-view-subtitle" class="text-[10px] font-medium text-gray-400 dark:text-gray-400 block">
              Resumen operativo, métricas y pedidos
            </span>
          </div>
        </div>

        <!-- Desktop Universal Search Bar (Command Quick Finder) -->
        <div class="relative flex-1 max-w-md hidden md:block mx-2">
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 text-xs">
              🔍
            </span>
            <input 
              type="text" 
              id="global-search-input" 
              placeholder="Buscar recetas, insumos, clientes o cotizaciones... (Ctrl + K)" 
              autocomplete="off"
              oninput="App.handleGlobalSearch(this.value)"
              onfocus="App.handleGlobalSearch(this.value)"
              class="w-full pl-8 pr-12 py-1.5 text-xs bg-gray-50/80 dark:bg-slate-800/80 border border-gray-200/80 dark:border-slate-700 rounded-xl text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:bg-white dark:focus:bg-slate-900 transition"
            />
            <span class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none text-[10px] text-gray-400 font-mono bg-gray-200/50 dark:bg-slate-700/50 my-1.5 px-1.5 rounded">
              ⌘K
            </span>
          </div>

          <!-- Dropdown con resultados de búsqueda global -->
          <div id="global-search-results" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-slate-700 overflow-hidden z-50 max-h-96 overflow-y-auto custom-scrollbar animate-fade-in">
          </div>
        </div>

        <!-- Right Header Actions (Quick Action '+', Switcher, Google Auth, Install PWA, Settings) -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <!-- Botón de Creación Rápida '+' en Desktop -->
          <div class="relative hidden sm:block">
            <button 
              type="button" 
              onclick="App.toggleQuickCreateDropdown()"
              title="Creación Rápida"
              class="flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-700 hover:to-rose-600 text-white text-xs font-bold rounded-xl shadow-xs transition cursor-pointer active:scale-95"
            >
              <span>✨</span>
              <span>+ Nuevo</span>
            </button>
            <div id="quick-create-dropdown" class="hidden absolute right-0 mt-1.5 w-48 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-gray-100 dark:border-slate-700 py-1 z-50 animate-scale-up">
              <button onclick="App.quickCreateAction('quote')" class="w-full text-left px-3.5 py-2 text-xs font-semibold text-gray-700 dark:text-gray-200 hover:bg-pink-50 dark:hover:bg-slate-800 flex items-center gap-2 transition cursor-pointer">
                <span>📋</span> Nueva Cotización
              </button>
              <button onclick="App.quickCreateAction('recipe')" class="w-full text-left px-3.5 py-2 text-xs font-semibold text-gray-700 dark:text-gray-200 hover:bg-pink-50 dark:hover:bg-slate-800 flex items-center gap-2 transition cursor-pointer">
                <span>🎂</span> Nueva Receta / Ficha
              </button>
              <button onclick="App.quickCreateAction('ingredient')" class="w-full text-left px-3.5 py-2 text-xs font-semibold text-gray-700 dark:text-gray-200 hover:bg-pink-50 dark:hover:bg-slate-800 flex items-center gap-2 transition cursor-pointer">
                <span>📦</span> Nuevo Insumo
              </button>
              <button onclick="App.quickCreateAction('customer')" class="w-full text-left px-3.5 py-2 text-xs font-semibold text-gray-700 dark:text-gray-200 hover:bg-pink-50 dark:hover:bg-slate-800 flex items-center gap-2 transition cursor-pointer">
                <span>👥</span> Nuevo Cliente
              </button>
              <div class="border-t border-gray-100 dark:border-slate-800 my-1"></div>
              <button onclick="App.quickCreateAction('scan_receipt')" class="w-full text-left px-3.5 py-2 text-xs font-semibold text-pink-600 dark:text-pink-400 hover:bg-pink-50 dark:hover:bg-slate-800 flex items-center gap-2 transition cursor-pointer">
                <span>🧾</span> Escanear Boleta OCR
              </button>
            </div>
          </div>

          <!-- Conmutador Rápido de Ambiente (Productos ↔ Servicios) -->
          <button id="mode-switcher-btn" onclick="App.showModeSelectionModal()" title="Cambiar entre Venta de Productos y Prestación de Servicios"
            class="flex items-center gap-1 px-2.5 sm:px-3 py-1.5 rounded-xl border text-xs font-bold shadow-2xs transition active:scale-95 bg-white dark:bg-slate-800 border-pink-200 dark:border-slate-700 hover:border-pink-400 cursor-pointer">
            <span id="mode-switcher-icon" class="text-sm">🎂</span>
            <span id="mode-switcher-label" class="hidden sm:inline font-bold text-gray-800 dark:text-gray-100">Productos</span>
            <span class="text-[10px] text-gray-400 dark:text-gray-500">⇄</span>
          </button>

          <!-- Contenedor de Autenticación con Google -->
          <div id="auth-header-container"></div>

          <!-- Botón Instalar PWA -->
          <button id="pwa-install-btn" onclick="App.installPWA()"
            class="hidden bg-pink-100 dark:bg-slate-800 hover:bg-pink-200 dark:hover:bg-slate-700 text-pink-700 dark:text-pink-300 px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1">
            <span>📲</span> <span class="hidden sm:inline">Instalar App</span>
          </button>

          <!-- Ajustes en móvil -->
          <button onclick="App.switchTab('settings')" data-tab="settings" title="Configuración"
            class="nav-btn md:hidden p-1.5 sm:p-2 text-gray-500 dark:text-gray-300 hover:text-pink-600 dark:hover:text-pink-400 hover:bg-pink-50 dark:hover:bg-slate-800 rounded-xl transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>

      </div>
    </header>

    <!-- Main Content Container (Solo el contenido interno tiene scroll en escritorio) -->
    <main id="app-main-content" class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 lg:p-8 md:overflow-y-auto custom-scrollbar">
      <!-- View Containers -->
      <section id="dashboard-view"></section>
      <section id="quotes-view" class="hidden"></section>
      <section id="customers-view" class="hidden"></section>
      <section id="recipes-view" class="hidden"></section>
      <section id="ingredients-view" class="hidden"></section>
      <section id="simulator-view" class="hidden"></section>
      <section id="market-radar-view" class="hidden"></section>
      <section id="finance-view" class="hidden"></section>
      <section id="settings-view" class="hidden"></section>
    </main>

  </div>

  <!-- Contenedor Portal para Modales Globales (Fuera de las vistas para centrado perfecto) -->
  <div id="modals-root">
    <!-- Modal de Selección de Ambiente (Productos vs Servicios) -->
    <div id="mode-selection-modal" class="hidden fixed inset-0 z-70 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
      <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 max-w-xs w-full shadow-2xl border border-gray-100 dark:border-slate-800 space-y-4 modal-animate-in">

        <div class="grid grid-cols-2 gap-3">
          <!-- Tarjeta Productos -->
          <button 
            type="button"
            onclick="this.classList.add('mode-card-selected'); setTimeout(() => App.setAppMode('products'), 350);"
