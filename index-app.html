<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cakekulator App - Gestión Móvil Pastelera</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#ec4899">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cakekulator App">
  <link rel="manifest" href="manifest-app.json">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            pink: {
              50: '#fdf2f8',
              100: '#fce7f3',
              200: '#fbcfe8',
              300: '#f9a8d4',
              400: '#f472b6',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
              800: '#9d174d',
              900: '#831843',
            },
            dark: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#0b0f19',
            }
          }
        }
      }
    }
  </script>

  <!-- Firebase App, Auth, Firestore & Messaging SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- HTML2Canvas & PDF Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Leaflet Map CSS & JS for Seller Radar Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Chart.js for Finance Panel -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>

<body
  class="app-view text-gray-800 dark:text-gray-100 bg-[#faf5f8] dark:bg-[#0f172a] antialiased min-h-screen flex flex-col pb-24 transition-colors duration-200 select-none sm:select-auto">

  <!-- ==========================================
       MAIN APP WRAPPER (MOBILE APP VIEW)
       ========================================== -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Top Mobile Navigation Header (Limpio y Unificado) -->
    <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-pink-100/80 dark:border-slate-800 shadow-2xs px-3.5 py-2.5 transition-colors duration-200">
      <div class="max-w-md mx-auto flex items-center justify-between gap-2">

        <!-- Mobile Brand Logo -->
        <div class="flex items-center gap-2 cursor-pointer select-none group min-w-0 shrink"
          onclick="App.switchTab('dashboard')">
          <img id="header-brand-logo" src="assets/icons/logo.png" alt="Cakekulator Logo"
            class="w-8 h-8 rounded-xl shadow-md shadow-pink-200/70 dark:shadow-none object-cover ring-1 ring-pink-200/50 dark:ring-slate-700 shrink-0">
          <div class="min-w-0">
            <span id="header-brand-title"
              class="font-extrabold text-base text-gray-900 dark:text-white tracking-tight block leading-none">
              Cake<span class="text-pink-600 dark:text-pink-400">kulator</span>
            </span>
            <span id="header-brand-name"
              class="text-[9px] font-semibold text-gray-400 dark:text-gray-400 uppercase tracking-wider truncate max-w-[100px] block">
              App Vendedor Móvil
            </span>
          </div>
        </div>

        <!-- Right Header Actions -->
        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Insignia de Suscripción PRO / Plan -->
          <div class="subscription-status-badge"></div>

          <!-- Contenedor de Autenticación con Google -->
          <div id="auth-header-container"></div>

          <!-- Botón Campana de Notificaciones -->
          <button id="btn-header-notifs" onclick="NotificationsModule.openCenter()" title="Notificaciones"
            class="relative p-1.5 text-gray-500 dark:text-gray-300 hover:text-pink-600 dark:hover:text-pink-400 hover:bg-pink-50 dark:hover:bg-slate-800 rounded-xl transition cursor-pointer">
            <span class="text-base leading-none">🔔</span>
            <span id="notif-badge-count" class="notif-badge-count hidden absolute -top-0.5 -right-0.5 bg-pink-600 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center animate-pulse">0</span>
          </button>

          <!-- Botón Instalar PWA -->
          <button id="pwa-install-btn" onclick="App.installPWA()"
            class="hidden bg-pink-100 dark:bg-slate-800 hover:bg-pink-200 dark:hover:bg-slate-700 text-pink-700 dark:text-pink-300 px-2 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1">
            <span>📲</span>
          </button>

          <!-- Ajustes en móvil -->
          <button onclick="App.switchTab('settings')" data-tab="settings" title="Configuración"
            class="nav-btn p-1.5 text-gray-500 dark:text-gray-300 hover:text-pink-600 dark:hover:text-pink-400 hover:bg-pink-50 dark:hover:bg-slate-800 rounded-xl transition cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>

      </div>
    </header>

    <!-- Main Content Container (Mobile Scrolling con margen inferior para dock flotante) -->
    <main id="app-main-content" class="flex-1 max-w-md w-full mx-auto p-3 pb-28 space-y-4">
      <!-- Indicador Táctil Pull-to-Refresh Móvil -->
      <div id="pull-to-refresh-container">
        <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/95 dark:bg-slate-800/95 shadow-md border border-pink-200/80 dark:border-slate-700 text-xs font-bold text-pink-600 dark:text-pink-400 select-none">
          <span class="pull-refresh-spinner">🧁</span>
          <span id="pull-refresh-text">Tira para actualizar...</span>
        </div>
      </div>
      <!-- View Containers -->
      <section id="dashboard-view"></section>
      <section id="quotes-view" class="hidden"></section>
      <section id="customers-view" class="hidden"></section>
      <section id="recipes-view" class="hidden"></section>
      <section id="ingredients-view" class="hidden"></section>
      <section id="simulator-view" class="hidden"></section>
      <section id="market-radar-view" class="hidden"></section>
      <section id="settings-view" class="hidden"></section>
    </main>

  </div>

  <!-- Contenedor Portal para Modales Globales -->
  <div id="modals-root">
    <!-- Modal de Selección de Ambiente (Productos vs Servicios) -->
    <div id="mode-selection-modal"
      class="hidden fixed inset-0 z-70 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
      <div
        class="bg-white dark:bg-slate-900 rounded-3xl p-5 max-w-xs w-full shadow-2xl border border-gray-100 dark:border-slate-800 space-y-4 modal-animate-in">

        <div class="grid grid-cols-2 gap-3">
          <!-- Tarjeta Productos -->
          <button type="button"
            onclick="this.classList.add('mode-card-selected'); setTimeout(() => App.setAppMode('products'), 350);"
            class="mode-card group relative p-5 rounded-2xl border-2 border-pink-200 dark:border-pink-800 bg-pink-50/70 dark:bg-slate-800 hover:bg-pink-100/70 hover:border-pink-400 transition-all duration-200 cursor-pointer flex flex-col items-center gap-3 text-center">
            <span class="text-4xl group-hover:scale-110 transition-transform duration-300">🎂</span>
            <span class="font-black text-sm text-pink-700 dark:text-pink-300">Productos</span>
          </button>

          <!-- Tarjeta Servicios -->
          <button type="button"
            onclick="this.classList.add('mode-card-selected'); setTimeout(() => App.setAppMode('services'), 350);"
            class="mode-card group relative p-5 rounded-2xl border-2 border-teal-200 dark:border-teal-800 bg-teal-50/70 dark:bg-slate-800 hover:bg-teal-100/70 hover:border-teal-400 transition-all duration-200 cursor-pointer flex flex-col items-center gap-3 text-center">
            <span class="text-4xl group-hover:scale-110 transition-transform duration-300">💆</span>
            <span class="font-black text-sm text-teal-700 dark:text-teal-300">Servicios</span>
          </button>
        </div>

        <div class="text-center">
          <button type="button" onclick="App.closeModeSelectionModal()"
            class="text-[11px] text-gray-400 hover:text-gray-600 font-semibold transition">
            Cerrar
          </button>
        </div>
      </div>
    </div>

    <!-- Modal / Drawer Más Herramientas (Mobile Menu Moderno) -->
    <div id="mobile-more-modal"
      class="hidden fixed inset-0 z-70 bg-black/60 backdrop-blur-xs flex flex-col justify-end sm:items-center sm:justify-center p-0 sm:p-4 transition-all">
      <!-- Backdrop click to close -->
      <div class="absolute inset-0 cursor-pointer" onclick="App.closeMobileMoreDrawer()"></div>
      
      <!-- Drawer Card -->
      <div class="relative bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 max-w-md w-full shadow-2xl border border-gray-100 dark:border-slate-800 space-y-4 max-h-[85vh] overflow-y-auto z-10 animate-in slide-in-from-bottom duration-200">
        <!-- Handle bar -->
        <div class="w-12 h-1.5 bg-gray-300 dark:bg-slate-700 rounded-full mx-auto"></div>

        <div class="flex items-center justify-between pb-2 border-b border-gray-100 dark:border-slate-800">
          <div>
            <h3 class="text-base font-black text-gray-900 dark:text-white flex items-center gap-2">
              <span>✨</span> Más Herramientas
            </h3>
            <p class="text-xs text-gray-500 dark:text-slate-400">Todos los módulos y accesos rápidos</p>
          </div>
          <button type="button" onclick="App.closeMobileMoreDrawer()"
            class="p-2 rounded-full text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 bg-gray-100 dark:bg-slate-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Banner de Cambio de Ambiente (Productos / Servicios) -->
        <div class="p-3.5 rounded-2xl bg-gradient-to-r from-pink-50 to-teal-50 dark:from-pink-950/40 dark:to-teal-950/40 border border-pink-200/60 dark:border-slate-700/80 flex items-center justify-between">
          <div>
            <span class="text-[10px] uppercase tracking-wider font-extrabold text-gray-500 dark:text-slate-400">Ambiente actual</span>
            <div id="more-drawer-mode-name" class="font-black text-sm text-pink-700 dark:text-pink-300">🎂 Pastelería & Productos</div>
          </div>
          <button type="button" onclick="App.closeMobileMoreDrawer(); App.showModeSelectionModal();"
            class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 text-gray-800 dark:text-white font-extrabold text-xs border border-gray-200 dark:border-slate-600 shadow-xs hover:border-pink-400 active:scale-95 transition flex items-center gap-1.5 cursor-pointer">
            <span>🔄</span> <span>Cambiar</span>
          </button>
        </div>

        <!-- Grid de Accesos (4 Módulos Esenciales Móvil) -->
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <!-- Insumos -->
          <button type="button" onclick="App.switchTab('ingredients')"
            class="p-3 rounded-2xl border border-gray-100 dark:border-slate-800 bg-gray-50/70 dark:bg-slate-800/60 hover:border-pink-300 dark:hover:border-pink-800 active:scale-98 transition flex items-start gap-3 text-left group cursor-pointer">
            <span class="text-2xl p-2 rounded-xl bg-white dark:bg-slate-700 shadow-xs group-hover:scale-110 transition">📦</span>
            <div class="min-w-0">
              <div id="more-drawer-text-ingredients" class="font-black text-xs text-gray-900 dark:text-white truncate">Insumos</div>
              <div class="text-[10px] text-gray-500 dark:text-slate-400 truncate">Precios y mermas</div>
            </div>
          </button>

          <!-- Clientes -->
          <button type="button" onclick="App.switchTab('customers')"
            class="p-3 rounded-2xl border border-gray-100 dark:border-slate-800 bg-gray-50/70 dark:bg-slate-800/60 hover:border-pink-300 dark:hover:border-pink-800 active:scale-98 transition flex items-start gap-3 text-left group cursor-pointer">
            <span class="text-2xl p-2 rounded-xl bg-white dark:bg-slate-700 shadow-xs group-hover:scale-110 transition">👥</span>
            <div class="min-w-0">
              <div class="font-black text-xs text-gray-900 dark:text-white truncate">Clientes</div>
              <div class="text-[10px] text-gray-500 dark:text-slate-400 truncate">Historial y agenda</div>
            </div>
          </button>

          <!-- Simulador de Precios -->
          <button type="button" onclick="App.switchTab('simulator')"
            class="p-3 rounded-2xl border border-gray-100 dark:border-slate-800 bg-gray-50/70 dark:bg-slate-800/60 hover:border-pink-300 dark:hover:border-pink-800 active:scale-98 transition flex items-start gap-3 text-left group cursor-pointer">
            <span class="text-2xl p-2 rounded-xl bg-white dark:bg-slate-700 shadow-xs group-hover:scale-110 transition">🧮</span>
            <div class="min-w-0">
              <div class="font-black text-xs text-gray-900 dark:text-white truncate">Simulador</div>
              <div class="text-[10px] text-gray-500 dark:text-slate-400 truncate">Márgenes y precios</div>
            </div>
          </button>

          <!-- Radar Ofertas -->
          <button type="button" onclick="App.switchTab('market-radar')"
            class="p-3 rounded-2xl border border-gray-100 dark:border-slate-800 bg-gray-50/70 dark:bg-slate-800/60 hover:border-pink-300 dark:hover:border-pink-800 active:scale-98 transition flex items-start gap-3 text-left group cursor-pointer">
            <span class="text-2xl p-2 rounded-xl bg-white dark:bg-slate-700 shadow-xs group-hover:scale-110 transition">🛒</span>
            <div class="min-w-0">
              <div class="font-black text-xs text-gray-900 dark:text-white truncate">Radar Ofertas</div>
              <div class="text-[10px] text-gray-500 dark:text-slate-400 truncate">Precios super</div>
            </div>
          </button>
        </div>

        <!-- Botón Tutorial Guiado en Más Opciones -->
        <button type="button" onclick="App.closeMobileMoreDrawer(); if (typeof TutorialModule !== 'undefined') TutorialModule.start(0);"
          class="w-full p-2.5 rounded-2xl bg-gradient-to-r from-pink-500/10 via-rose-500/10 to-teal-500/10 border border-pink-200 dark:border-pink-900/60 hover:border-pink-400 active:scale-98 transition flex items-center justify-between text-left cursor-pointer">
          <div class="flex items-center gap-2.5">
            <span class="text-xl p-1.5 rounded-xl bg-white dark:bg-slate-700 shadow-2xs">🎓</span>
            <div>
              <div class="font-black text-xs text-pink-700 dark:text-pink-300">Tutorial Guiado Interactivo</div>
              <div class="text-[10px] text-gray-500 dark:text-slate-400">Aprende a usar todas las funciones</div>
            </div>
          </div>
          <span class="text-xs font-bold text-pink-600 dark:text-pink-400">Iniciar ↗</span>
        </button>

        <button type="button" onclick="App.closeMobileMoreDrawer()"
          class="w-full py-2.5 rounded-xl bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-slate-300 font-bold text-xs hover:bg-gray-200 dark:hover:bg-slate-700 transition">
          Cerrar Menú
        </button>
      </div>
    </div>

    <!-- Modal / Drawer Ingresar Datos (+) (Acciones Rápidas) -->
    <div id="quick-data-input-modal"
      class="hidden fixed inset-0 z-70 bg-black/60 backdrop-blur-xs flex flex-col justify-end sm:items-center sm:justify-center p-0 sm:p-4 transition-all">
      <!-- Backdrop click to close -->
      <div class="absolute inset-0 cursor-pointer" onclick="App.closeQuickDataInputDrawer()"></div>
      
      <!-- Drawer Card -->
      <div class="relative bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 max-w-md w-full shadow-2xl border border-gray-100 dark:border-slate-800 space-y-4 max-h-[85vh] overflow-y-auto z-10 animate-in slide-in-from-bottom duration-200">
        <!-- Handle bar -->
        <div class="w-12 h-1.5 bg-gray-300 dark:bg-slate-700 rounded-full mx-auto"></div>

        <div class="flex items-center justify-between pb-2 border-b border-gray-100 dark:border-slate-800">
          <div>
            <h3 class="text-base font-black text-gray-900 dark:text-white flex items-center gap-2">
              <span class="text-pink-600 dark:text-pink-400">➕</span> Ingresar Datos
            </h3>
            <p class="text-xs text-gray-500 dark:text-slate-400">¿Qué deseas registrar en el sistema?</p>
          </div>
          <button type="button" onclick="App.closeQuickDataInputDrawer()"
            class="p-2 rounded-full text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 bg-gray-100 dark:bg-slate-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Grid de Opciones para Ingresar Datos -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
          <!-- 1. Nueva Cotización / Presupuesto -->
          <button type="button" onclick="App.quickCreateAction('quote'); App.closeQuickDataInputDrawer();"
            class="p-3.5 rounded-2xl border border-pink-200/70 dark:border-slate-800 bg-pink-50/50 dark:bg-slate-800/60 hover:bg-pink-100/60 active:scale-98 transition flex items-center gap-3.5 text-left group cursor-pointer">
            <span class="text-2xl p-2.5 rounded-2xl bg-white dark:bg-slate-700 shadow-xs group-hover:scale-110 transition">📋</span>
            <div class="min-w-0 flex-1">
              <div id="quick-input-text-quote" class="font-black text-sm text-gray-900 dark:text-white truncate">Nueva Cotización</div>
              <div class="text-[11px] text-gray-500 dark:text-slate-400 truncate">Calcular costo y registrar pedido</div>
            </div>
          </button>

          <!-- 2. Nueva Receta / Ficha de Servicio -->
          <button type="button" onclick="App.quickCreateAction('recipe'); App.closeQuickDataInputDrawer();"
            class="p-3.5 rounded-2xl border border-pink-200/70 dark:border-slate-800 bg-pink-50/50 dark:bg-slate-800/60 hover:bg-pink-100/60 active:scale-98 transition flex items-center gap-3.5 text-left group cursor-pointer">
            <span id="quick-input-icon-recipe" class="text-2xl p-2.5 rounded-2xl bg-white dark:bg-slate-700 shadow-xs group-hover:scale-110 transition">🎂</span>
            <div class="min-w-0 flex-1">
              <div id="quick-input-text-recipe" class="font-black text-sm text-gray-900 dark:text-white truncate">Nueva Receta</div>
              <div class="text-[11px] text-gray-500 dark:text-slate-400 truncate">Ficha técnica, tiempos y porciones</div>
            </div>
          </button>

          <!-- 3. Nuevo Insumo -->
          <button type="button" onclick="App.quickCreateAction('ingredient'); App.closeQuickDataInputDrawer();"
            class="p-3.5 rounded-2xl border border-gray-100 dark:border-slate-800 bg-gray-50/70 dark:bg-slate-800/60 hover:border-pink-300 active:scale-98 transition flex items-center gap-3.5 text-left group cursor-pointer">
            <span class="text-2xl p-2.5 rounded-2xl bg-white dark:bg-slate-700 shadow-xs group-hover:scale-110 transition">📦</span>
            <div class="min-w-0 flex-1">
              <div id="quick-input-text-ing" class="font-black text-sm text-gray-900 dark:text-white truncate">Nuevo Insumo</div>
              <div class="text-[11px] text-gray-500 dark:text-slate-400 truncate">Precio de compra, unidad y merma</div>
            </div>
          </button>

          <!-- 4. Nuevo Cliente -->
          <button type="button" onclick="App.quickCreateAction('customer'); App.closeQuickDataInputDrawer();"
            class="p-3.5 rounded-2xl border border-gray-100 dark:border-slate-800 bg-gray-50/70 dark:bg-slate-800/60 hover:border-pink-300 active:scale-98 transition flex items-center gap-3.5 text-left group cursor-pointer">
            <span class="text-2xl p-2.5 rounded-2xl bg-white dark:bg-slate-700 shadow-xs group-hover:scale-110 transition">👥</span>
            <div class="min-w-0 flex-1">
              <div class="font-black text-sm text-gray-900 dark:text-white truncate">Nuevo Cliente</div>
              <div class="text-[11px] text-gray-500 dark:text-slate-400 truncate">Contacto, WhatsApp y dirección</div>
            </div>
          </button>
