<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cakekulator App - Gestión Móvil Pastelera</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#ec4899">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cakekulator App">
  <link rel="manifest" href="manifest-app.json">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pink: {
              50: '#fdf2f8',
              100: '#fce7f3',
              200: '#fbcfe8',
              300: '#f9a8d4',
              400: '#f472b6',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
              800: '#9d174d',
              900: '#831843',
            },
            dark: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#0b0f19',
            }
          }
        }
      }
    }
  </script>

  <!-- Firebase App, Auth, Firestore & Messaging SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- HTML2Canvas & PDF Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Leaflet Map CSS & JS for Seller Radar Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Chart.js for Finance Panel -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>

<body
  class="text-gray-800 dark:text-gray-100 bg-[#faf5f8] dark:bg-[#0f172a] antialiased min-h-screen flex flex-col pb-24 transition-colors duration-200 select-none sm:select-auto">

  <!-- ==========================================
       MAIN APP WRAPPER (MOBILE APP VIEW)
       ========================================== -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Top Mobile Navigation Header -->
    <header
      class="shrink-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-pink-100/80 dark:border-slate-800 px-3.5 py-2.5 sticky top-0">
      <div class="max-w-md mx-auto flex items-center justify-between gap-2">

        <!-- Mobile Brand Logo -->
        <div class="flex items-center gap-2 cursor-pointer select-none group shrink-0"
          onclick="App.switchTab('dashboard')">
          <img id="header-brand-logo" src="assets/icons/logo.png" alt="Cakekulator Logo"
            class="w-8 h-8 rounded-xl shadow-md shadow-pink-200/70 dark:shadow-none object-cover ring-1 ring-pink-200/50 dark:ring-slate-700">
          <div>
            <span id="header-brand-title"
              class="font-extrabold text-base text-gray-900 dark:text-white tracking-tight block leading-none">
              Cake<span class="text-pink-600 dark:text-pink-400">kulator</span>
            </span>
            <span id="header-brand-name"
              class="text-[9px] font-semibold text-gray-400 dark:text-gray-400 uppercase tracking-wider truncate max-w-[120px] block">
              App Vendedor Móvil
            </span>
          </div>
        </div>

        <!-- Right Header Actions -->
        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Contenedor de Autenticación con Google -->
          <div id="auth-header-container"></div>

          <!-- Botón Instalar PWA -->
          <button id="pwa-install-btn" onclick="App.installPWA()"
            class="hidden bg-pink-100 dark:bg-slate-800 hover:bg-pink-200 dark:hover:bg-slate-700 text-pink-700 dark:text-pink-300 px-2 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1">
            <span>📲</span>
          </button>

          <!-- Ajustes en móvil -->
          <button onclick="App.switchTab('settings')" data-tab="settings" title="Configuración"
            class="nav-btn p-1.5 text-gray-500 dark:text-gray-300 hover:text-pink-600 dark:hover:text-pink-400 hover:bg-pink-50 dark:hover:bg-slate-800 rounded-xl transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>

      </div>
    </header>

    <!-- Main Content Container (Mobile Scrolling) -->
    <main id="app-main-content" class="flex-1 max-w-md w-full mx-auto p-3 space-y-4">
      <!-- View Containers -->
      <section id="dashboard-view"></section>
      <section id="quotes-view" class="hidden"></section>
      <section id="customers-view" class="hidden"></section>
      <section id="recipes-view" class="hidden"></section>
      <section id="ingredients-view" class="hidden"></section>
      <section id="simulator-view" class="hidden"></section>
      <section id="market-radar-view" class="hidden"></section>
      <section id="finance-view" class="hidden"></section>
      <section id="settings-view" class="hidden"></section>
    </main>

  </div>

  <!-- Contenedor Portal para Modales Globales -->
  <div id="modals-root">
    <!-- Modal de Selección de Ambiente (Productos vs Servicios) -->
    <div id="mode-selection-modal"
      class="hidden fixed inset-0 z-70 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
      <div
        class="bg-white dark:bg-slate-900 rounded-3xl p-5 max-w-xs w-full shadow-2xl border border-gray-100 dark:border-slate-800 space-y-4 modal-animate-in">

        <div class="grid grid-cols-2 gap-3">
          <!-- Tarjeta Productos -->
          <button type="button"
            onclick="this.classList.add('mode-card-selected'); setTimeout(() => App.setAppMode('products'), 350);"
            class="mode-card group relative p-5 rounded-2xl border-2 border-pink-200 dark:border-pink-800 bg-pink-50/70 dark:bg-slate-800 hover:bg-pink-100/70 hover:border-pink-400 transition-all duration-200 cursor-pointer flex flex-col items-center gap-3 text-center">
            <span class="text-4xl group-hover:scale-110 transition-transform duration-300">🎂</span>
            <span class="font-black text-sm text-pink-700 dark:text-pink-300">Productos</span>
          </button>

          <!-- Tarjeta Servicios -->
          <button type="button"
            onclick="this.classList.add('mode-card-selected'); setTimeout(() => App.setAppMode('services'), 350);"
            class="mode-card group relative p-5 rounded-2xl border-2 border-teal-200 dark:border-teal-800 bg-teal-50/70 dark:bg-slate-800 hover:bg-teal-100/70 hover:border-teal-400 transition-all duration-200 cursor-pointer flex flex-col items-center gap-3 text-center">
            <span class="text-4xl group-hover:scale-110 transition-transform duration-300">💆</span>
            <span class="font-black text-sm text-teal-700 dark:text-teal-300">Servicios</span>
          </button>
        </div>

        <div class="text-center">
          <button type="button" onclick="App.closeModeSelectionModal()"
            class="text-[11px] text-gray-400 hover:text-gray-600 font-semibold transition">
            Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav id="mobile-bottom-nav"
    class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-pink-100 dark:border-slate-800 px-1 py-1.5 flex items-center justify-around shadow-lg transition-all duration-300 transform"
    style="padding-bottom: calc(0.45rem + env(safe-area-inset-bottom, 0px));">
    <!-- 1. Inicio -->
    <button onclick="App.switchTab('dashboard')" data-tab="dashboard" id="nav-btn-home-mob"
      class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 rounded-xl transition-all duration-300 touch-manipulation cursor-pointer">
      <span class="nav-icon text-xl leading-none pointer-events-none">🏠</span>
      <span class="nav-label text-[9px] font-bold pointer-events-none truncate max-w-full">Inicio</span>
    </button>
    <!-- 2. Simular -->
    <button onclick="App.switchTab('simulator')" data-tab="simulator" id="nav-btn-simulator-mob"
      class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 rounded-xl transition-all duration-300 touch-manipulation cursor-pointer">
      <span class="nav-icon text-xl leading-none pointer-events-none">🧮</span>
      <span class="nav-label text-[9px] font-bold pointer-events-none truncate max-w-full">Simular</span>
    </button>
    <!-- 3. Cotizar -->
    <button onclick="App.switchTab('quotes')" data-tab="quotes" id="nav-btn-quotes-mob"
      class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 rounded-xl transition-all duration-300 touch-manipulation cursor-pointer">
      <span id="nav-icon-quotes-mob" class="nav-icon text-xl leading-none pointer-events-none">📋</span>
      <span id="nav-text-quotes-mob"
        class="nav-label text-[9px] font-bold pointer-events-none truncate max-w-full">Cotizar</span>
    </button>
    <!-- 4. Recetas / Servicios -->
    <button onclick="App.switchTab('recipes')" data-tab="recipes" id="nav-btn-recipes-mob"
      class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 rounded-xl transition-all duration-300 touch-manipulation cursor-pointer">
      <span id="nav-icon-recipes-mob" class="nav-icon text-xl leading-none pointer-events-none">🎂</span>
      <span id="nav-text-recipes-mob"
        class="nav-label text-[9px] font-bold pointer-events-none truncate max-w-full">Recetas</span>
    </button>
    <!-- 5. Insumos -->
    <button onclick="App.switchTab('ingredients')" data-tab="ingredients" id="nav-btn-ingredients-mob"
      class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 rounded-xl transition-all duration-300 touch-manipulation cursor-pointer">
      <span id="nav-icon-ingredients-mob" class="nav-icon text-xl leading-none pointer-events-none">📦</span>
      <span id="nav-text-ingredients-mob"
        class="nav-label text-[9px] font-bold pointer-events-none truncate max-w-full">Insumos</span>
    </button>
    <!-- 6. Ofertas -->
    <button onclick="App.switchTab('market-radar')" data-tab="market-radar" id="nav-btn-market-mob"
      class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 rounded-xl transition-all duration-300 touch-manipulation cursor-pointer">
      <span class="nav-icon text-xl leading-none pointer-events-none">🛒</span>
      <span class="nav-label text-[9px] font-bold pointer-events-none truncate max-w-full">Ofertas</span>
    </button>
    <!-- 7. Clientes -->
    <button onclick="App.switchTab('customers')" data-tab="customers" id="nav-btn-customers-mob"
      class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 rounded-xl transition-all duration-300 touch-manipulation cursor-pointer">
      <span class="nav-icon text-xl leading-none pointer-events-none">👥</span>
      <span class="nav-label text-[9px] font-bold pointer-events-none truncate max-w-full">Clientes</span>
    </button>
    <!-- 8. Finanzas -->
    <button onclick="App.switchTab('finance')" data-tab="finance" id="nav-btn-finance-mob"
      class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 rounded-xl transition-all duration-300 touch-manipulation cursor-pointer">
      <span class="nav-icon text-xl leading-none pointer-events-none">📊</span>
      <span class="nav-label text-[9px] font-bold pointer-events-none truncate max-w-full">Finanzas</span>
    </button>
  </nav>

  <!-- Scripts -->
  <script src="js/firebase-config.js?v=6.0"></script>
  <script src="js/config.local.js?v=6.0"></script>
  <script src="js/auth.js?v=6.0"></script>
  <script src="js/notifications.js?v=6.0"></script>
  <script src="js/templates.js?v=6.0"></script>
  <script src="js/db.js?v=6.0"></script>
  <script src="js/gemini-service.js?v=6.0"></script>
  <script src="js/ingredients.js?v=6.0"></script>
  <script src="js/receipt-scanner.js?v=6.0"></script>
  <script src="js/recipe-scanner.js?v=6.0"></script>
  <script src="js/market-radar.js?v=6.0"></script>
  <script src="js/finance.js?v=6.0"></script>
  <script src="js/recipes.js?v=6.0"></script>
  <script src="js/simulator.js?v=6.0"></script>
  <script src="js/quotes.js?v=6.0"></script>
  <script src="js/customers.js?v=6.0"></script>
  <script src="js/receipts.js?v=6.0"></script>
  <script src="js/seller-requests.js?v=6.0"></script>
  <script src="js/app.js?v=6.0"></script>
</body>

</html>
